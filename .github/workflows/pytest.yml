name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pure-tests:
    name: 纯函数测试 (pure_tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行纯函数测试
        run: python -m pytest pure_tests/ -v

  integration-tests:
    name: 集成测试 (tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: zaojia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行集成测试
        env:
          DATABASE_URL: postgresql://odoo:odoo@localhost:5432/zaojia_test
          TEST_DATABASE_URL: sqlite:///:memory:
        run: python -m pytest tests/ -v

  security-tests:
    name: 安全用例 (S1-S9 + N1-N3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行安全用例
        run: python -m pytest tests/ -m security -v
